services:
  - type: web
    name: chatbot-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: FLASK_ENV
        value: production
      - key: SHOW_BROWSER
        value: false
      - key: RECORD_VIDEO
        value: false
      # Firebase credentials (set manual từ Render dashboard)
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false  # Set manual từ Render dashboard
      - key: ADMIN_KEY
        sync: false  # Set manual từ Render dashboard (dùng để init payloads)

