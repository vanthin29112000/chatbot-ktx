[build]
  command = "npm run build"
  publish = "dist"
  ignore = ".netlifyignore"

# SPA redirect - redirect all routes to index.html
# This ensures all routes work for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "18"
  # Tắt Python build hoàn toàn (frontend không cần Python)
  PIPENV_DEFAULT_PYTHON_VERSION = ""
  PYTHON_VERSION = ""
  # Force chỉ dùng Node.js, không detect Python
  NPM_FLAGS = "--production=false"
  
# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

